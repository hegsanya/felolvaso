<!DOCTYPE html>
<html lang="hu">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FELOLVASÓ</title>
<style>
    /* Sötét mód */
    .dark-mode {
        background-color: #000000;
        color: #fff;
    }
    .dark-mode textarea {
        background-color: #000000;
        color: #fff;
    }
    .blue-mode {
        background-color: rgb(40, 40, 40);
        color: #fff;
    }
    .blue-mode textarea {
        background-color: rgb(40, 40, 40);
        color: #fff;
    }
    .button {
        font-size: 18px;
        margin-right: 5px;
        background-color: lightgray;
        color: black;
        border-radius: 5px; /* A kívánt kerekítés mérete pixelben */
    }
    .button_lepteto {
        font-size: 18px;
        margin-right: 10px;
        background-color: rgb(23, 54, 93);
        box-shadow: 0px 0px 10px cyan;
        color: white;
        border-radius: 5px; /* A kívánt kerekítés mérete pixelben */
    }
    .checkbox {
        transform: scale(1.5); /* Növelje 1.5-szeresére a méretet */
        -webkit-transform: scale(1.5); /* Safari */
        -moz-transform: scale(1.5); /* Firefox */
        -ms-transform: scale(1.5); /* Internet Explorer */
        -o-transform: scale(1.5); /* Opera */
        margin: 10px; /* Igény szerint állítsd be a margót */
    }
    .cimcsoport {
        text-align: center;
    }
    .lablec {
        text-align: center;
    }
    .FOCIM{
        background-color: rgb(23, 54, 93);
        color: rgb(255, 255, 255); 
    }
    textarea{
      resize: none;
    }

    /*
    #csoport1, #csoport2,  #csoport3, #csoport4 {
      display: block;
      margin: 0 auto;
      text-align: center;
      height: 100%;
    } 
    */ 

    #csoport1 input[type="text"],
    #csoport2 input[type="text"],
    #csoport3 input[type="text"],
    #csoport4 input[type="text"],
    #csoport5 input[type="text"],
    #csoport6 input[type="text"] {
      width: 200px;
    }

    brKICSI {
        display: block;
        line-height: 25px;
    }
    .mezo {
        box-shadow: 0px 0px 0px blue;
        /*font-family: 'Comic Sans MS', cursive;*/
        /*font-family: 'Patrick Hand', cursive;*/
        /*font-family: 'Dancing Script', cursive;*/
        /*font-family: 'Kalam', cursive;*/
        /*font-family: 'Kalam', 'Patrick Hand', 'Dancing Script', cursive;*/
    }
    /* v7.8: Szókiemelés – a felolvasott szó (sötét módban is olvasható) */
    .szoKiemeles mark {
        background-color: yellow;
        color: black;
        border-radius: 3px;
    }
    .log-hidden {
        display: none;
    }

    .log-visible {
        display: block;
    }

    #logContainer {
        display: none; /* Alapértelmezett állapot: rejtve van */
    }
</style>
</head>

// ===== HANGLISTÁK (v7.7) =====

// Nyelvkód egységesítése: "en_US" / "EN-us" → "en-us"
// (Androidon néha aláhúzással jön a nyelvkód.)
function nyelvKod(lang) {
    return String(lang || "").replace("_", "-").toLowerCase();
}

// Az elérhető, használható böngésző-hangok.
// A hibás ("undefined" nevű) Edge-hangokat kihagyjuk.
function hasznalhatoHangok() {
    return window.speechSynthesis.getVoices()
        .filter(v => v.name && !v.name.includes("undefined"));
}

// Egy panel nyelvéhez illő hangok.
// - "Minden hang" bekapcsolva: az összes hang
// - különben: azonos alapnyelv (pl. "en" → en-US, en-GB, en-AU ...)
// Sorrend: a pontosan egyező nyelvűek elöl (pl. en-GB panelen az en-GB hangok).
function panelHangjai(lang) {
    const hangok = hasznalhatoHangok();
    const cel = nyelvKod(lang);
    const alapNyelv = cel.split("-")[0];   // "en-gb" → "en"

    let lista;
    if (document.getElementById("mindenHangCheckbox").checked) {
        lista = hangok.slice();
    } else {
        lista = hangok.filter(v => nyelvKod(v.lang).split("-")[0] === alapNyelv);
    }

    // Pontos egyezés előre, egyébként az eredeti sorrend marad
    const pontos = lista.filter(v => nyelvKod(v.lang) === cel);
    const tobbi = lista.filter(v => nyelvKod(v.lang) !== cel);
    return pontos.concat(tobbi);
}

// Egy panel hanglistájának feltöltése
function updateVoices(panelIndex) {
    const p = panels[panelIndex - 1];

    const voiceSelect = document.getElementById(p.voiceId);
    const lang = document.getElementById(p.langId).value;

    // v7.7: Régi, sorszámos mentés egyszeri átalakítása névre.
    // A régi program a PONTOSAN egyező nyelvű hangok listájában tárolta a sorszámot.
    if (valasztottHang[p.id] === undefined && regiHangIndex[p.id] !== undefined) {
        const regiLista = window.speechSynthesis.getVoices().filter(v => v.lang === lang);
        if (regiLista[regiHangIndex[p.id]]) {
            valasztottHang[p.id] = regiLista[regiHangIndex[p.id]].name;
            delete regiHangIndex[p.id];
        }
    }

    // Hanglista törlése és újratöltése
    voiceSelect.innerHTML = "";

    panelHangjai(lang).forEach(voice => {
        const option = document.createElement("option");
        option.value = voice.name;   // v7.7: az érték a hang NEVE (nem sorszám)
        option.textContent = voice.name + " (" + voice.lang + ")";
        voiceSelect.appendChild(option);
    });

    // A megjegyzett hang kiválasztása (ha szerepel a listában)
    restoreVoiceSelection(panelIndex);
}

// A megjegyzett hang kiválasztása a listában (név szerint).
// Ha a hang (még) nincs a listában – pl. az online hangok később töltődnek be –,
// a megjegyzett nevet NEM töröljük, így később megtalálja.
function restoreVoiceSelection(panelIndex) {
    const p = panels[panelIndex - 1];

    const voiceSelect = document.getElementById(p.voiceId);
    const nev = valasztottHang[p.id];

    if (!nev) return;

    for (let i = 0; i < voiceSelect.options.length; i++) {
        if (voiceSelect.options[i].value === nev) {
            voiceSelect.selectedIndex = i;
            return;
        }
    }
}

}

function readCurrentRow() {
    if (isSpeakingCancelled) return;

    let visiblePanels = panels.filter(p => {
        const group = document.getElementById("csoport" + p.id);
        return group && group.style.display !== "none";
    });

    speakPanelsChain(visiblePanels, 0, function() {
        // NINCS léptetés itt!
        // A stepMode majd eldönti, hogy kell-e léptetni.
    });
}

function speakPanelsChain(list, index, finishedCallback) {
    if (index >= list.length) {

        // Ha stepMode aktív → léptetés
        if (stepMode && !isSpeakingCancelled) {

            // v7.3: Az utolsó sornál a léptetés megáll
            // (régen az utolsó sort végtelenül újra és újra felolvasta).
            if (currentRowIndex >= filteredData.length - 1) {
                toggleStepMode();   // kikapcsolja a léptetést
                return;
            }

            nextRow();
            updateFields();
            readCurrentRow();

            // v7.3: Léptetéskor NEM hívjuk meg a finishedCallback-et.
            // Így ha az Ismétlés is be van kapcsolva, nem indul el
            // két felolvasás egyszerre (a léptetés az erősebb).
            return;
        }

        // Felolvas gomb / Ismétlés mód callback
        if (finishedCallback) finishedCallback();
        return;
    }

    speakPanelCallback(list[index].id, function () {
        // Ha utolsó panel → nincs szünet
        if (index >= list.length - 1) {
            speakPanelsChain(list, index + 1, finishedCallback);
            return;
        }

        // Szünet hossza (másodperc → ms)
        let pause = parseFloat(document.getElementById("szunethossza").value) || 0;

        setTimeout(function () {
            speakPanelsChain(list, index + 1, finishedCallback);
        }, pause * 1000);
    });
}

function speakPanelCallback(panelId, done) {
    if (isSpeakingCancelled) {
        done();
        return;
    }

    const p = panels[panelId - 1];

    const textArea = document.getElementById(p.textId);
    const langSelect = document.getElementById(p.langId);
    const voiceSelect = document.getElementById(p.voiceId);
    const speedInput = document.getElementById(p.speedId);
    const bong = document.getElementById(p.bongId);

    // Ha böngésző hang mód aktív → mentett hang visszaállítása
    // v7.3: régen a BE gomb click()-jével, most közvetlenül.
    if (bong.checked) {
        restoreVoiceSelection(panelId);
    }

    const text = textArea.value.trim();
    if (!text) {
        done();
        return;
    }

    // Beszéd paraméterei
    const rate = parseFloat(speedInput.value) || 1;
    const lang = langSelect.value;

    // Hang kiválasztása (csak böngésző módban)
    let voice = null;
    if (bong.checked) {
        // v7.7: a hangot NÉV szerint keressük (régen sorszám szerint)
        const voices = speechSynthesis.getVoices();
        voice = voices.find(v => v.name === voiceSelect.value) || null;
    }

    // v7.7: ha a "Minden hang" miatt más nyelvű hangot választottak,
    // a felolvasás nyelve a hangé legyen (különben a böngésző eldobhatja a hangot)
    const beszedNyelv = voice ? voice.lang : lang;

    // Kiemelés felolvasás közben
    textArea.style.boxShadow = "0 0 10px yellow";

    // v7.3: A felolvasást a speakTextInChunks végzi.
    // Ha a "Tördelés" be van kapcsolva, darabokban olvas, különben egyben.
    // v7.8: Szókiemelés (ha be van kapcsolva)

// ===== LÁTHATÓ MEZŐK SZÁMA (v7.6) =====
//
// A régi toggleCsoportB és toggleCsoportC_Radio helyett.
// A panelek mindig sorrendben látszanak: 1 és 2 mindig,
// utána 3, 4, 5, 6 – annyi, amennyit a mezoSzam mond.

const MEZO_MIN = 2;   // az 1. és 2. panel mindig látszik
const MEZO_MAX = 6;   // összesen 6 panel van

let mezoSzam = 2;     // a felhasználó által beállított mezőszám (álló nézet szerint)

// Igaz, ha álló nézet van kiválasztva
function alloNezet() {
    return document.querySelector('input[name="allolap"]:checked').value === "allo";
}

// A ténylegesen látható mezők száma.
// Álló nézetben = mezoSzam.
// Fekvő nézetben a panelek párban állnak, ezért páratlan számnál
// a következő párosat mutatjuk (3 → 4, 5 → 6).
function lathatoMezoSzam() {
    if (alloNezet()) {
        return mezoSzam;
    }
    return (mezoSzam % 2 === 1) ? mezoSzam + 1 : mezoSzam;
}

// "Mező +" gomb
function mezoPlusz() {
    if (alloNezet()) {
        mezoSzam = mezoSzam + 1;                // egyesével
    } else {
        mezoSzam = lathatoMezoSzam() + 2;       // párban
    }
    if (mezoSzam > MEZO_MAX) mezoSzam = MEZO_MAX;

    mezoLathatosag();
    saveSettings();
}

// "Mező −" gomb
function mezoMinusz() {
    if (alloNezet()) {
        mezoSzam = mezoSzam - 1;                // egyesével
    } else {
        mezoSzam = lathatoMezoSzam() - 2;       // párban
    }
    if (mezoSzam < MEZO_MIN) mezoSzam = MEZO_MIN;

    mezoLathatosag();
    saveSettings();
}

// A 3–6. panel megjelenítése / elrejtése a mezőszám alapján.
// (A felolvasás magától csak a látható paneleket olvassa fel.)
function mezoLathatosag() {
    const db = lathatoMezoSzam();

    for (let id = 3; id <= MEZO_MAX; id++) {
        const panelDiv = document.getElementById("csoport" + id);

        if (id <= db) {
            // Ha most válik láthatóvá, a hangválasztó állapotát is frissítjük
            if (panelDiv.style.display === "none") {
                panelDiv.style.display = "block";
                toggleVoiceMode(id);
            }
        } else {
            panelDiv.style.display = "none";
        }
    }

    // Kijelzés és gombok állapota
    document.getElementById("mezoSzamLabel").textContent = db + " / " + MEZO_MAX;
    document.getElementById("mezoMinuszGomb").disabled = (db <= MEZO_MIN);
    document.getElementById("mezoPluszGomb").disabled = (db >= MEZO_MAX);
}

async function requestWakeLock() {
    if (!('wakeLock' in navigator)) {
        document.getElementById('WakeLock').textContent = `WakeLock nem támogatott`;
        addLog('Ez a böngésző nem támogatja a Wake Lock-ot.');

    try {
        wakeLock = await navigator.wakeLock.request('screen');
        document.getElementById('WakeLock').textContent = `WakeLock ON`;
        addLog('Kijelző ébren tartva.');
    } catch (err) {
        // Hibakezelés: Ha a Wake Lock kérés sikertelen
        console.error(`Wake Lock kérés sikertelen: ${err}`);
        document.getElementById('WakeLock').textContent = `WakeLock OFF`;
        addLog(`Wake Lock kérés sikertelen: ${err}`);
    }
}

// Wake Lock feloldása
async function releaseWakeLock() {
    if (wakeLock !== null) {
        await wakeLock.release();
        wakeLock = null;
        document.getElementById('WakeLock').textContent = `WakeLock OFF`;
        addLog('Kijelző már nincs ébren tartva.');

        if (mouseInterval) {
            clearInterval(mouseInterval);
            mouseInterval = null;
        }
    }
}

// ===== CSV FELDOLGOZÁS (v7.3) =====

// Egy CSV sor felbontása pontosvessző mentén.
// - Idézőjelek közötti pontosvesszőt NEM tekint elválasztónak
//   (az Excel így menti, ha a szövegben pontosvessző van).
// - A dupla idézőjel ("") a szövegen belül egy idézőjelet jelent.
function parseCsvLine(line) {
    const cells = [];
    let cell = "";
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
        const ch = line[i];

        if (inQuotes) {
            // Idézőjeles mezőn belül vagyunk
            if (ch === '"') {
                if (line[i + 1] === '"') {
                    cell += '"';      // "" → egy idézőjel
                    i++;
                } else {
                    inQuotes = false; // idézőjeles rész vége
                }
            } else {
                cell += ch;
            }
        } else {
            // Normál mező
            if (ch === '"' && cell === "") {
                inQuotes = true;      // idézőjeles mező kezdete
            } else if (ch === ';') {
                cells.push(cell);     // mező vége
                cell = "";
            } else {
                cell += ch;
            }
        }
    }
    cells.push(cell); // utolsó mező
    return cells;
}

// A teljes fájl feldolgozása sorokra és oszlopokra.
// - BOM (láthatatlan jel a fájl elején) eltávolítása
// - Windows (\r\n) és Unix (\n) sorvégek egyformán kezelve
// - Üres sorok kihagyása
function parseCSV(contents) {
    // v7.5: az összes BOM levágása a fájl elejéről (volt, hogy kettő volt)
    contents = contents.replace(/^\uFEFF+/, "");

    return contents
        .split(/\r?\n/)
        .filter(line => line.trim() !== "")
        .map(line => parseCsvLine(line));
}

// Dátum értelmezése többféle formátumból.
// Elfogadja: "2026.02.07.", "2026.02.07. 12:30", "2026-02-07", "2026/02/07"
// Visszaad: Date objektumot (helyi idő, éjfél), vagy null-t, ha nem értelmezhető.
// (A new Date("2026.02.07.") Firefoxban és Safariban hibás eredményt ad.)
function parseDate(value) {
    if (!value) return null;

    const m = String(value).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (m) {
        return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    }

    const d = new Date(value);
    return isNaN(d) ? null : d;
}

// A fájl tartalmának betöltése.
// Ezt használja a FÁJLKEZELŐ (readCSV) és az oldal indulásakor
// a legutóbb megnyitott fájl visszatöltése is.
// Visszaad: true, ha sikerült; false, ha a fájl hibás.
function readCSVFromContent(contents) {
    const data = parseCSV(contents);

    // Oszlopszám ellenőrzés
    // (hu, en, de, es, fr, it, dátum, téma, tr = 9 oszlop)
    if (!data[0] || data[0].length < 9) {
        alert("Figyelem: A CSV fájl nem tartalmazza mind a 9 oszlopot!");
        return false;
    }

    csvData = data;
    filteredData = csvData;
    currentRowIndex = 0;
    updateFields();

    // Különböző értékek kigyűjtése a téma oszlopból (7. index)
    var uniqueValues = [...new Set(csvData.map(row => row[7] || "N/A"))];
    var temaSelect = document.getElementById('temaSelect');
    temaSelect.innerHTML = ''; // Legördülő menü ürítése

    uniqueValues.forEach(function(value) {
        var option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        temaSelect.appendChild(option);
    });

    // Táblázat (v7.3: egyetlen hívás, a szűrt adatokkal)
    refreshCsvTable(filteredData);

    // Téma frissítés
    setTimeout(() => {
        temaSelect.dispatchEvent(new Event('change'));
    }, 300);

    return true;
}

function filterByTema() {
    const temaSelect = document.getElementById('temaSelect');
    const selectedOptions = Array.from(temaSelect.selectedOptions).map(option => option.value);
    const checkbox = document.getElementById('toggleCheckbox');

    if (selectedOptions.length > 0) {
        filteredData = csvData.filter(row => {
            const isMatch = selectedOptions.includes(row[7]);

function filterByDate() {
    // v7.3: parseDate – minden böngészőben működik.
    // Ha valamelyik dátum üres, arra az oldalra nincs korlát.
    var startDate = parseDate(document.getElementById('date1').value);
    var endDate = parseDate(document.getElementById('date2').value);

    filteredData = csvData.filter(function(row) {
        var rowDate = parseDate(row[6]);
        if (!rowDate) return false;                         // dátum nélküli sor kimarad
        if (startDate && rowDate < startDate) return false; // túl korai
        if (endDate && rowDate > endDate) return false;     // túl késői
        return true;
    });

    currentRowIndex = 0;
    updateFields();
    refreshCsvTable(filteredData);
}

// Szöveg darabolása felolvasáshoz.
// 1. lépés: mondatokra bontás.
//    v7.5: Mondatvég = . ! ? … (akár több is: "...", "?!"), utána
//    opcionálisan záró idézőjel / zárójel, és UTÁNA SZÓKÖZ.
//    A szóköz nélküli pont (2.0, 3.5, 2.000, www.x.hu) NEM mondatvég.
//    Az írásjel nélküli utolsó rész is megmarad.
// 2. lépés: ha egy mondat hosszabb, mint maxLen karakter,
//    szóhatárok (szóközök) mentén tovább bontja.
const MONDATVEG = /(?<=[.!?\u2026]["'\u201C\u201D\u2019\u00AB\u00BB)\]]*)\s+/;

function splitTextToChunks(text, maxLen) {
    // Vágás a mondatvég utáni szóközöknél; üres darabok kiszűrve
    let sentences = text.split(MONDATVEG).filter(function(s) {
        return s.trim() !== "";
    });
    if (sentences.length === 0) sentences = [text];

    const chunks = [];

    sentences.forEach(function(sentence) {
        let s = sentence.trim();

        // Túl hosszú mondat szétvágása
        while (s.length > maxLen) {
            let cut = s.lastIndexOf(" ", maxLen);  // utolsó szóköz a korláton belül
            if (cut <= 0) cut = maxLen;            // ha nincs szóköz, kemény vágás
            chunks.push(s.substring(0, cut).trim());
            s = s.substring(cut).trim();
        }

        if (s) chunks.push(s);
    });

    return chunks;
}

// v7.3: A tördelés karakterszám-mezője csak akkor látszik,
// ha az "Elakadó felolvasás kezelése" be van kapcsolva.

//Hosszú szöveg darabolása
// v7.8: Új, nem kötelező paraméter: onWord(kezdet, hossz)
// Minden felolvasott szó elején meghívódik; a kezdet a TELJES szövegen
// belüli karakter-pozíció (tördelésnél is), a hossz lehet undefined.
function speakTextInChunks(text, lang, rate, voice, onEndCallback, onWord) {
    var checkboxTordeles = document.getElementById('Tordeles');     //ha engedélyezve van

    if (checkboxTordeles.checked) {
        // A szöveg mondatokra bontása
        // v7.3: mondatokra ÉS karakterkorlát szerint bontás
        let maxLen = parseInt(document.getElementById('karakter').value) || 200;
        let sentences = splitTextToChunks(text, maxLen); // Regex a mondatok felismeréséhez

        let currentIndex = 0;

        // v7.8: Minden darab kezdőpozíciója a teljes szövegben
        // (hogy a darabon belüli szóhelyből a teljes szövegbeli helyet kapjuk)
        let chunkStarts = [];
        let keresesInnen = 0;
        sentences.forEach(function(s) {
            let pos = text.indexOf(s.trim(), keresesInnen);
            if (pos < 0) pos = keresesInnen;   // biztonsági tartalék
            chunkStarts.push(pos);
            keresesInnen = pos + s.trim().length;
        });

        function speakNextChunk() {
            // Ellenőrizzük, hogy a beszédet leállították-e
            if (isSpeakingCancelled) {
                speechSynthesis.cancel(); // Megállítja a beszédet
                if (onEndCallback) {
                    onEndCallback();
                }
                return;
            }

            if (currentIndex < sentences.length) {
                let chunk = sentences[currentIndex].trim(); // Az aktuális mondat

                let utterance = new SpeechSynthesisUtterance(chunk);
                utterance.lang = lang;
                utterance.rate = rate;
                utterance.voice = voice;

                // v7.8: Szóhatár-jelzés → kiemelés (a darab kezdőpozíciójával eltolva)
                let eltolas = chunkStarts[currentIndex];
                utterance.onboundary = function(event) {
                    if (onWord && (event.name === "word" || event.name === undefined)) {
                        onWord(eltolas + event.charIndex, event.charLength);
                    }
                };

                utterance.onend = function() {
                    currentIndex++;
                    speakNextChunk();
                };

                utterance.onerror = function(event) {
                    console.error('Felolvasási hiba történt:', event.error);
                    speechSynthesis.cancel(); // Biztosítjuk, hogy minden futó felolvasás megálljon
                    if (onEndCallback) {
                        onEndCallback();
                    }
                };

                speechSynthesis.speak(utterance);
            } else if (onEndCallback) {
                onEndCallback();
            }
        }

        speakNextChunk();
    } else {
        // Nem Windows esetén az egész szöveget egyszerre olvassa fel
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = rate;
        utterance.voice = voice;

        // v7.8: Szóhatár-jelzés → kiemelés
        utterance.onboundary = function(event) {
            if (onWord && (event.name === "word" || event.name === undefined)) {
                onWord(event.charIndex, event.charLength);
            }
        };

        // Ellenőrizzük, hogy a beszédet leállították-e
        if (isSpeakingCancelled) {
            speechSynthesis.cancel(); // Megállítja a beszédet
            if (onEndCallback) {
                onEndCallback();
            }
            return;
        }


        utterance.onend = function() {
            if (onEndCallback) {
                onEndCallback();
            }
        };

        utterance.onerror = function(event) {
            console.error('Felolvasási hiba történt:', event.error);
            speechSynthesis.cancel(); // Biztosítjuk, hogy minden futó felolvasás megálljon
            if (onEndCallback) {
                onEndCallback();
            }
        };

        speechSynthesis.speak(utterance);
    }
}

                value = value.replace(/\s+/g, "").substring(0, 10);
                // pl. "2026.02.07."
            }
            html += `<td>${value.toString().replace(/</g, "&lt;")}</td>`;
        });

        tr.innerHTML = html;
        fragment.appendChild(tr);
    }

    tbody.appendChild(fragment);
    csvTableIndex = end;

    info.textContent = `Megjelenítve: ${csvTableIndex} / ${tableSourceData.length}`;
    if (csvTableIndex >= tableSourceData.length) {
        info.textContent += " (vége)";
    }

    console.log(
    "HEADER:", 1 + VISIBLE_COLUMNS.length,
    "ROW:", document.querySelector("#csvTableBody tr")?.children.length
    );
}

function refreshCsvTable(sourceData) {
    tableSourceData = sourceData;

    document.getElementById("csvTableBody").innerHTML = "";

    if (!tableSourceData || tableSourceData.length === 0) {
        document.getElementById("csvRowInfo").textContent = "Nincs találat";
        return;
    }

    createCsvTableHeader(tableSourceData[0].length);

}

// ===== SZÓKIEMELÉS (v7.8) =====
//
// A szövegdobozban (textarea) nem lehet egyetlen szót kiszínezni.
// Ezért az első kiemeléskor a szövegdoboz mögé egy ugyanakkora
// megjelenítőt (div) teszünk, a szövegdobozt elrejtjük, és a
// megjelenítőben az aktuális szót <mark> jelöléssel kiemeljük.
// A felolvasás végén (vagy Stop-ra) a szövegdoboz visszaáll.

// HTML-ben különleges jelek (< > &) biztonságos kiírása
function htmlSzoveg(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// A szövegdobozhoz tartozó megjelenítő elkészítése (vagy a meglévő visszaadása)
function kiemeloMegjelenito(textArea) {
    const id = textArea.id + "_kiemeles";
    let div = document.getElementById(id);

    if (!div) {
        div = document.createElement("div");
        div.id = id;
        div.className = "szoKiemeles";
        textArea.parentNode.insertBefore(div, textArea.nextSibling);
    }

    div.style.display = "inline-block";
    div.style.boxShadow = textArea.style.boxShadow;   // sárga keret felolvasás közben

    // A kinézetet csak akkor vesszük át, amikor a szövegdoboz még látszik
    // (az első szónál). Elrejtve a mérete 0 lenne.
    if (textArea.offsetWidth === 0) {
        return div;
    }

    // Kinézet átvétele a szövegdoboztól (betű, keret, színek, méret)
    const st = window.getComputedStyle(textArea);
    div.style.verticalAlign = st.verticalAlign;
    div.style.boxSizing = "border-box";
    div.style.width = textArea.offsetWidth + "px";
    div.style.height = textArea.offsetHeight + "px";
    div.style.overflowY = "auto";
    div.style.position = "relative";      // a görgetés számításához
    div.style.textAlign = "left";
    div.style.whiteSpace = "pre-wrap";    // sortörések, szóközök megmaradnak
    div.style.wordWrap = "break-word";
    div.style.font = st.font;
    div.style.lineHeight = st.lineHeight;
    div.style.padding = st.padding;
    div.style.border = st.border;
    div.style.borderRadius = st.borderRadius;
    div.style.color = st.color;
    div.style.backgroundColor = st.backgroundColor;

    return div;
}

// Egy szó kiemelése.
// kezdet: a szó első karakterének helye a szövegben
// hossz:  a szó hossza (egyes böngészők nem adják meg → kiszámoljuk)
function szoKiemelese(textArea, text, kezdet, hossz) {
    if (kezdet === undefined || kezdet < 0 || kezdet >= text.length) return;

    // Ha a hossz hiányzik: a szó végéig (szóközig vagy írásjelig) tart
    if (!hossz) {
        const m = text.slice(kezdet).match(/^[^\s.,!?;:"„”“'()…]+/);
        hossz = m ? m[0].length : 1;
    }

    const div = kiemeloMegjelenito(textArea);

    div.innerHTML =
        htmlSzoveg(text.slice(0, kezdet)) +
        "<mark>" + htmlSzoveg(text.slice(kezdet, kezdet + hossz)) + "</mark>" +
        htmlSzoveg(text.slice(kezdet + hossz));

    // Szövegdoboz elrejtése, megjelenítő látszik
    textArea.style.display = "none";

    // Hosszú szövegnél görgetés, hogy a kiemelt szó látsszon
    const mark = div.querySelector("mark");
    if (mark) {
        const cel = mark.offsetTop - div.clientHeight / 2;
        div.scrollTop = Math.max(0, cel);
    }
}

// Kiemelés vége: megjelenítő el, eredeti szövegdoboz vissza
function szoKiemelesVege(textArea) {
    const div = document.getElementById(textArea.id + "_kiemeles");
    if (div) {
        div.style.display = "none";
        div.innerHTML = "";
    }
    textArea.style.display = "";
}

// Ébren tartás bekapcsolása
async function kepernyoEbrenTartasBE() {
    // Ha a beállításokban ki van kapcsolva, nem csinálunk semmit
    if (!document.getElementById('ebrenCheckbox').checked) return;

    ebrenKerve = true;

    // Ha már működik valamelyik módszer, nincs teendő
    // (pl. Ismétlés mellé bekapcsolják a Léptetést is)
    if (ebrenModszer === "wakelock" && wakeLock !== null && !wakeLock.released) return;
    if (ebrenModszer === "video" && !document.getElementById('ebrenVideo').paused) return;

    let wakeLockHiba = "";

    // ---- 1. módszer: Wake Lock ----
    if (!window.isSecureContext) {
        wakeLockHiba = "nem biztonságos megnyitás (" + location.protocol + ")";
    } else if (!('wakeLock' in navigator)) {
        wakeLockHiba = "a böngésző nem támogatja";
    } else {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            ebrenModszer = "wakelock";
            frissitEbrenJelzes("☀ Képernyő ébren tartva (Wake Lock)", "green");
            addLog('Kijelző ébren tartva (Wake Lock).');
            return;   // sikerült, a videóra nincs szükség
        } catch (err) {
            wakeLockHiba = err.message;   // pl. energiatakarékos mód
        }
    }
    addLog('Wake Lock nem elérhető: ' + wakeLockHiba);

    // ---- 2. módszer (tartalék): néma videó ----
    const video = document.getElementById('ebrenVideo');
    try {
        if (!video.src) {
            video.src = NEMA_VIDEO_MP4;
        }
        video.muted = true;   // biztos, ami biztos
        await video.play();
        ebrenModszer = "video";
        frissitEbrenJelzes("☀ Képernyő ébren tartva (néma videó) – Wake Lock: " + wakeLockHiba, "green");
    } catch (err) {
        ebrenModszer = "";
        frissitEbrenJelzes("⚠ A képernyő ébren tartása nem sikerült: " + err.message, "orangered");
    }
}

// Ébren tartás kikapcsolása
// Csak akkor kapcsol ki, ha sem az Ismétlés, sem a Léptetés nem fut már.
async function kepernyoEbrenTartasKI() {
    if (autoMode || stepMode) return;

    ebrenKerve = false;
    ebrenModszer = "";

    // Wake Lock elengedése
    if (wakeLock !== null) {
        try { await wakeLock.release(); } catch (err) { /* már el volt engedve */ }
        wakeLock = null;
    }

    // Videó leállítása
    document.getElementById('ebrenVideo').pause();

    frissitEbrenJelzes("");
}

// A beállítás (jelölőnégyzet) változásakor
function ebrenBeallitasValtozott() {
    if (document.getElementById('ebrenCheckbox').checked) {
        // Ha épp fut az Ismétlés / Léptetés, azonnal bekapcsol
        if (autoMode || stepMode) kepernyoEbrenTartasBE();
    } else {
        // Kikapcsolás: a módoktól függetlenül leállítjuk
        ebrenKerve = false;
        if (wakeLock !== null) { wakeLock.release().catch(() => {}); wakeLock = null; }
        document.getElementById('ebrenVideo').pause();
        frissitEbrenJelzes("");
    }
}

// Ha másik alkalmazásra váltasz, a böngésző elengedi a Wake Lockot

    if (document.visibilityState === 'visible' && ebrenKerve) {

});

const canvas = document.getElementById("drawArea");
const ctx = canvas.getContext("2d");
const container = document.getElementById("canvasContainer");

let drawing = false;

// DPI-helyes és méretpontos canvas beállítás
function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    //canvas.style.width = "100%";
    canvas.style.height = "300px";   // ← EZT ÁLLÍTSD AMEKKORÁRA AKAROD

    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = canvas.offsetHeight * dpr;

    ctx.setTransform(1, 0, 0, 1, 0, 0); // reset
    ctx.scale(dpr, dpr);
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// Mutat / Elrejt gomb
function toggleCanvas() {
    if (container.style.display === "none") {
        container.style.display = "block";
        resizeCanvas();
    } else {
        container.style.display = "none";
    }
}

// Pozíció meghatározás (egér + érintés)
function getPos(e) {
    const rect = canvas.getBoundingClientRect();

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

// Rajzolás indítása
function startDraw(e) {
    e.preventDefault();
    drawing = true;

    const pos = getPos(e);

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
}

// Rajzolás befejezése
function endDraw() {
    drawing = false;
}

// Rajzolás folyamata
function draw(e) {
    if (!drawing) return;
    e.preventDefault();

    const pos = getPos(e);

    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.strokeStyle = "red";

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
}

// Canvas törlése
function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// Egér események
canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mouseup", endDraw);
canvas.addEventListener("mouseleave", endDraw);
canvas.addEventListener("mousemove", draw);

// Érintés események (tablet, stylus)
canvas.addEventListener("touchstart", startDraw, { passive: false });
canvas.addEventListener("touchend", endDraw);
canvas.addEventListener("touchcancel", endDraw);
canvas.addEventListener("touchmove", draw, { passive: false });
